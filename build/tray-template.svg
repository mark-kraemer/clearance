<?xml version="1.0" encoding="UTF-8"?>
<!-- Clearance menu-bar glyph: the app's check-in-a-ring mark on the 16px
     status-glyph grid, black only, so macOS can tint it as a template image. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <circle cx="8" cy="8" r="6.25" fill="none" stroke="#000000" stroke-width="1.5"/>
  <polyline points="5,8.2 7.2,10.3 11,5.8" fill="none" stroke="#000000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
