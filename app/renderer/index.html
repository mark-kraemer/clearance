<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Clearance</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg hidden xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-pending" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.6 2.1" stroke-linecap="round"/></symbol>
  <symbol id="i-active" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 3.5a4.5 4.5 0 0 1 0 9z" fill="currentColor"/></symbol>
  <symbol id="i-done" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.75" fill="currentColor"/><path d="M5 8.2l2 2 4-4.2" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-skipped" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 8h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-attn" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.75" fill="currentColor"/><path d="M8 4.6v4" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11.2" r=".95" fill="#fff"/></symbol>
  <symbol id="i-work" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.5V8l2.3 1.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-open" viewBox="0 0 16 16"><path d="M6.5 3.5H4a1 1 0 0 0-1 1V12a1 1 0 0 0 1 1h7.5a1 1 0 0 0 1-1V9.5M9.5 3h3.5v3.5M13 3L7.5 8.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-branch" viewBox="0 0 16 16"><circle cx="4.5" cy="3.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="4.5" cy="12.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="11.5" cy="5.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 5.1v5.8M11.5 7.1c0 2.4-2.4 3-5.3 3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-pr" viewBox="0 0 16 16"><circle cx="4" cy="3.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="4" cy="12.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 5.1v5.8M12 10.9V7a2 2 0 0 0-2-2H8.5M10 3l-1.8 2L10 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v3.2l2 1.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-send" viewBox="0 0 16 16"><path d="M8 13V3.5M4.5 7L8 3.5 11.5 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 16 16"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 16 16"><path d="M10 3.5L5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 16 16"><path d="M2.5 9h3l1 1.8h3L10.5 9h3M2.5 9l1.6-5h7.8l1.6 5v3.5a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  <symbol id="i-shield" viewBox="0 0 16 16"><path d="M8 2l5 2v4c0 3-2.2 5-5 6-2.8-1-5-3-5-6V4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
</svg>

<div class="app" id="app" data-view="detail">
  <header class="titlebar">
    <div class="wtitle"><strong>Clearance</strong><span class="sub" id="title-sub"></span></div>
    <div class="toolbar">
      <button class="search" id="btn-palette" aria-label="Search runs and commands"><svg class="ico" aria-hidden="true"><use href="#i-search"/></svg><span>Search runs</span><kbd>⌘K</kbd></button>
      <button class="icon-btn" id="btn-new" aria-label="New run"><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg></button>
      <button class="icon-btn" id="btn-theme" aria-label="Toggle appearance"><svg class="ico" aria-hidden="true"><use href="#i-moon"/></svg></button>
    </div>
  </header>
  <div class="split">
    <nav class="list" id="list" aria-label="Runs"></nav>
    <main class="detail" id="detail" aria-live="polite"></main>
  </div>
  <footer class="statusbar">
    <span id="status-left"></span>
    <span class="hide-sm" id="status-mid"></span>
    <span class="right" id="status-right"></span>
  </footer>
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-labelledby="sheet-title">
      <h2 id="sheet-title">New run</h2>
      <form id="newrun-form" novalidate>
        <div class="f"><span class="lbl" id="nr-kind-label">Kind</span><div class="seg" role="group" aria-labelledby="nr-kind-label"><button type="button" data-kind="feature" aria-pressed="true">Feature</button><button type="button" data-kind="bug" aria-pressed="false">Bug</button></div></div>
        <div class="f"><label for="nr-task">Task</label><input id="nr-task" type="text" placeholder="ALM-520 Partner pulse digest email" autocomplete="off" spellcheck="false"><span class="err" id="nr-err" hidden></span></div>
        <div class="f"><label for="nr-repo">Repository</label><select id="nr-repo"></select></div>
        <div class="f"><span class="lbl">Worktree</span><span class="derived" id="nr-branch"></span></div>
        <div class="f"><span class="lbl">Runs</span><code class="cmd" id="nr-cmd"></code></div>
        <div class="f"><span class="note">Uses the <code>claude</code> you are signed into, in auto mode. Permission escalations and gates show up here.</span></div>
        <div class="sheet-actions"><button type="button" class="btn" data-cancel>Cancel</button><button type="submit" class="btn primary" id="nr-start">Start run <kbd>⌘↩</kbd></button></div>
      </form>
    </div>
  </div>
  <div class="palette" id="palette" hidden>
    <div class="pal" role="dialog" aria-label="Search runs and commands">
      <input id="pal-input" type="text" placeholder="Jump to a run or run a command" autocomplete="off" aria-label="Search">
      <ul id="pal-list"></ul>
    </div>
  </div>
</div>
<script src="renderer.js"></script>
</body>
</html>
