<!--
THESIS: A control room for concurrent Claude Code pipeline runs where the run waiting on a human is always the headline and its gate is answered where it is read. It refuses the dashboard-of-cards and the chat transcript as the way to find out what needs you.
OWN-WORLD: The macOS productivity canon played straight at the craft level of Linear, Raycast and Apple Mail: a unified title bar, a two-pane split view, system type, cool neutral surfaces, system-blue selection, and three semantic states (needs you amber, working blue, done green) drawn as 16px status glyphs.
STORY: The user returns after an hour, sees four runs need them ordered by how long they have waited, reads one gate, answers in a line, and moves on with a keystroke.
FIRST VIEWPORT: Left, the run list grouped Needs you / Working / Done with status glyph, issue key, title, stage, and elapsed wait. Right, the selected run: stage rail with notes, the open gate's full content, quick replies, and the answer field. Primary action: Send (Cmd+Return).
FORM: Category standard, chosen by the user over the roll (seed key 389f75b7, assigned grounded direction 7 declined).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

/* New run sheet */
.sheet { position: absolute; inset: 0; z-index: 30; display: grid; place-items: start center; padding-top: 52px; background: rgba(20, 22, 30, .18); }
.sheet-card { width: min(540px, calc(100% - 32px)); background: var(--pane); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px; box-shadow: var(--shadow); animation: sheetdown .22s cubic-bezier(.2, .8, .2, 1); }
@keyframes sheetdown { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet h2 { margin: 0; padding: 14px 18px 11px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--line-soft); }
.sheet form { padding: 16px 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.f { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 12px; align-items: center; }
.f > label, .f > .lbl { font-size: 12.5px; color: var(--fg-2); text-align: right; }
.f input[type="text"], .f select { width: 100%; height: 28px; padding: 0 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--field); }
.f input[type="text"]:focus, .f select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.f input[aria-invalid="true"] { border-color: var(--attn); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; padding: 2px; background: var(--list); justify-self: start; }
.seg button { border: 0; background: none; padding: 3px 12px; border-radius: 5px; font-size: 12.5px; color: var(--fg-2); }
.seg button[aria-pressed="true"] { background: var(--pane); color: var(--fg); box-shadow: 0 1px 2px rgba(20, 22, 30, .12); }
.f .derived { font-family: var(--mono); font-size: 11.5px; color: var(--fg-2); overflow-wrap: anywhere; min-height: 16px; }
.f .err { grid-column: 2; font-size: 11.5px; color: var(--attn-fg); }
.f .note { grid-column: 2; font-size: 12px; color: var(--fg-3); }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
.pick { position: relative; min-width: 0; }
.picker { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 2; margin: 0; padding: 4px; list-style: none; background: var(--pane); border: 1px solid var(--line); border-radius: 7px; box-shadow: var(--shadow); max-height: 232px; overflow-y: auto; }
.picker li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 5px; font-size: 12.5px; cursor: default; }
.picker li[aria-selected="true"], .picker li:hover { background: var(--sel); }
.picker .key { font-family: var(--mono); font-size: 11px; color: var(--fg-2); }
.picker .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.picker .meta { font-size: 11px; color: var(--fg-3); white-space: nowrap; }
.picker .meta.warn { color: var(--attn-fg); }
.picker .none { display: block; color: var(--fg-3); padding: 6px 8px; font-size: 12px; }
.f .f-sub { grid-column: 2; font-size: 11.5px; color: var(--fg-2); }
.f .f-sub:empty { display: none; }
.f .cmd { font-family: var(--mono); font-size: 11.5px; color: var(--fg-2); background: var(--list); border: 1px solid var(--line-soft); border-radius: 7px; padding: 6px 9px; overflow-wrap: anywhere; line-height: 1.5; }
.f .cmd b { font-weight: 500; color: var(--fg); }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--fg); cursor: pointer; }
.check input { accent-color: var(--accent); margin: 0; width: 14px; height: 14px; }

@media (max-width: 760px) {
  body { padding: 0; }
  .app { border: 0; border-radius: 0; box-shadow: none; max-width: none; }
  .titlebar { grid-template-columns: auto 1fr auto; height: 48px; padding-inline: 10px; }
  .lights { display: none; }
  .wtitle { text-align: left; }
  .search { min-width: 0; width: 28px; padding: 0; justify-content: center; }
  .search span, .search kbd { display: none; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .list { border-right: 0; }
  .app[data-view="detail"] .list { display: none; }
  .app[data-view="list"] .detail { display: none; }
  .btn.d-back { display: inline-flex; }
  .d-wrap { padding: 12px 16px 28px; }
  .rail { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 0; margin-bottom: 14px; }
  .stage { padding: 0; }
  .stage + .stage { padding-left: 0; }
  .stage + .stage::before { display: none; }
  .stage .s-note { display: none; }
  .stage:not(.active) .s-top span { display: none; }
  .d-head .actions { width: 100%; }
  .notices { top: 54px; }
  .sheet { padding-top: 48px; }
  .f { grid-template-columns: minmax(0, 1fr); }
  .f > label, .f > .lbl { text-align: left; }
  .f .err, .f .note, .f .f-sub { grid-column: 1; }
  .statusbar .hide-sm { display: none; }
  kbd, .row .num { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const now = () => Date.now();
  const minsAgo = (m) => now() - m * 60000;
  const icon = (name, cls) => `<svg class="ico glyph ${cls || ''}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const STAGE_ICON = { pending: 'pending', active: 'active', done: 'done', skipped: 'skipped' };
  const STAGE_CLS = { pending: '', active: 'work', done: 'ok', skipped: 'skip' };
  const STAGES = {
    feature: [['plan', 'Plan'], ['implement', 'Implement'], ['review', 'Review'], ['pr', 'File PR'], ['feedback', 'Feedback']],

  };
  const GATE_NAME = { G1: 'Scope', G2: 'Plan', G3: 'Visual', G4: 'Review triage', G5: 'Side effects' };

  function stages(kind, status, notes) {
    return STAGES[kind].map(([id, label]) => ({ id, label, status: status[id] || 'pending', note: (notes && notes[id]) || '' }));
  }

  /* All runs below are synthetic example data for the prototype. */
  const SEED_RUNS = [

      gate: { id: 'G4', since: minsAgo(18), summary: '3 findings · 2 fix, 1 ask', kind: 'triage' },
      history: [['Started', 'feature pipeline, worktree hbr-480-client-tools'], ['G1', 'one PR, 3 pts, two questions answered'], ['G2', 'go'], ['Implement', '18 specs green, 4 commits']],

  /* Gate bodies and quick replies. */

      quick: ['Keep all three recommendations', 'A: callback instead', 'B: roll on close, no confirm'],
      body: () => `

        <details class="decided"><summary>Decided unless you object · 4</summary><ul>
          <li>Money stays integer cents plus a display string, like every other amount.</li>

        <p><strong>Deferred:</strong> rolling across projects, and a report of all transfers. Both go to follow-up issues.</p>
        <p><strong>Test seams:</strong> <code>MilestoneCloser#call</code> (unit), the close action (request spec), and the milestone page line (system spec).</p>
        <p class="muted">Anything found later that is beyond this plan becomes a follow-up issue, not part of the PR.</p>
        <p><strong>Implement?</strong></p>`,
    },
    visual: {
      quick: ['Looks right, go', 'Blank the zeros', 'Wrap is fine'],
      body: () => `
        <div class="shot">
          <svg viewBox="0 0 720 300" role="img" aria-label="Screenshot of the booked hours report on development data">
            <rect width="720" height="300" fill="var(--pane)"/>

  /* State */
  let selectedId = null;
  let composerDraft = {};
  let listFocusIndex = 0;

  const byId = (id) => runs.find((r) => r.id === id);
  const group = (r) => (r.gate ? 'needs' : r.done ? 'done' : 'working');
  function ordered() {
    const needs = runs.filter((r) => group(r) === 'needs').sort((a, b) => a.gate.since - b.gate.since);
    const working = runs.filter((r) => group(r) === 'working');
    const done = runs.filter((r) => group(r) === 'done');
    return { needs, working, done, flat: [...needs, ...working, ...done] };
  }
  function fmtDur(ms) {
    const m = Math.max(0, Math.round(ms / 60000));
    if (m < 1) return '<1m';
    if (m < 60) return m + 'm';
    const h = Math.floor(m / 60), d = Math.floor(h / 24);
    if (d >= 1) return d + 'd ' + (h % 24) + 'h';
    return h + 'h ' + (m % 60 ? (m % 60) + 'm' : '');
  }
  const activeStage = (r) => r.stages.find((s) => s.status === 'active') || r.stages[r.stages.length - 1];

  /* Rendering */
  function renderList() {
    const o = ordered();
    const sections = [
      ['needs', 'Needs you', o.needs, 'No run is waiting on you.'],
      ['working', 'Working', o.working, 'Nothing is running.'],
      ['done', 'Done today', o.done, ''],
    ];
    let n = 0;
    let html = '';
    for (const [key, label, items, emptyText] of sections) {
      if (key === 'done' && !items.length) continue;
      html += `<div class="group-h ${key === 'needs' ? 'attn' : ''}"><span>${label}</span><span class="n">${items.length}</span></div>`;
      if (!items.length) html += `<div class="group-empty">${emptyText}</div>`;
      for (const r of items) {
        n += 1;
        const g = group(r);
        const st = activeStage(r);
        let glyph, sub, trail;
        if (g === 'needs') {
          glyph = icon('attn', 'attn');
          sub = `${st.label} · ${r.gate.id} ${GATE_NAME[r.gate.id]}`;
          trail = `<span class="wait">${fmtDur(now() - r.gate.since)}</span>`;
        } else if (g === 'working') {
          glyph = icon('work', 'work pulse');
          sub = `${st.label} · ${esc(r.working.label)}`;
          trail = `<span class="wait">${fmtDur(now() - r.started)} in</span>`;
        } else {
          glyph = icon('done', 'ok');
          sub = `${r.done.label} · ${esc(r.stages.find((s) => s.id === 'pr').note.replace('github.com/acme/', ''))}`;
          trail = `<span class="wait">${fmtDur(now() - r.done.when)} ago</span>`;
        }
        html += `<button class="row ${g}" role="option" data-id="${r.id}" aria-selected="${r.id === selectedId}" tabindex="${r.id === selectedId ? 0 : -1}">
          ${glyph}
          <span><span class="t"><span class="key">${r.key}</span><span class="name">${esc(r.title)}</span></span><span class="muted">${sub}</span></span>
          <span>${trail}${n <= 9 ? `<span class="num">⌘${n}</span>` : ''}</span>
        </button>`;
      }
    }
    $('list').innerHTML = html;
    const needsN = o.needs.length, workN = o.working.length;
    $('title-sub').textContent = needsN ? `${needsN} need${needsN === 1 ? 's' : ''} you · ${workN} working` : `${workN} working · nothing needs you`;
    document.title = needsN ? `Clearance (${needsN})` : 'Clearance';
    $('status-left').textContent = `${runs.length} runs`;
    $('sess').textContent = runs.length;
    $('status-mid').textContent = `${needsN} need you · ${workN} working · ${o.done.length} done today`;
  }

  function renderDetail() {
    const r = byId(selectedId);
    const el = $('detail');
    if (!r) {
      el.innerHTML = runs.length
        ? `<div class="empty">${icon('inbox')}<h2>No run selected</h2><p>Pick a run on the left, or press ⌘1 to ⌘9.</p></div>`
        : `<div class="empty">${icon('inbox')}<h2>No runs on the board</h2><p>Press ⌘N to start one here, or start a pipeline in Claude Code and it appears on the board. ⌘K then “Reset sample runs” brings the examples back.</p></div>`;
      return;
    }
    const g = group(r);
    const rail = r.stages.map((s) => `<div class="stage ${s.status}"><div class="s-top">${icon(STAGE_ICON[s.status], STAGE_CLS[s.status])}<span>${s.label}</span></div>${s.note ? `<div class="s-note">${s.note.startsWith('github.com') ? `<a href="https://${s.note}" target="_blank" rel="noopener">${s.note.replace('github.com/acme/', '')}</a>` : esc(s.note)}</div>` : ''}</div>`).join('');
    let panel = '';
    if (g === 'needs') {
      const spec = GATES[r.gate.kind];
      const draft = composerDraft[r.id] || '';
      panel = `<section class="panel attn" aria-label="Open gate">
        <div class="p-head"><span class="gate-id">${r.gate.id}</span><strong>${GATE_NAME[r.gate.id]}</strong><span class="since">${icon('clock')}waiting ${fmtDur(now() - r.gate.since)}</span></div>
        <div class="p-body">${spec.body(r)}</div>
        <div class="composer">
          <div class="quick" role="group" aria-label="Quick replies">${spec.quick.map((q) => `<button class="chip ${draft === q ? 'on' : ''}" data-quick="${esc(q)}">${esc(q)}</button>`).join('')}</div>
          <form class="field" id="answer-form">
            <label class="vh" for="answer">Your answer</label>
            <textarea id="answer" rows="1" placeholder="One line: go, or fix 1 and 3">${esc(draft)}</textarea>
            <button class="btn primary" type="submit" id="send">${icon('send')}Send <kbd>⌘↩</kbd></button>
          </form>
          <div class="hint">Sent to the session as your reply. The pipeline continues from this gate without another stop.</div>
        </div>
      </section>`;
    } else if (g === 'working') {
      panel = `<section class="panel" aria-label="Activity">
        <div class="p-head">${icon('work', 'work pulse')}<strong>Working</strong><span class="muted">${esc(r.working.label)}</span><span class="since">${icon('clock')}${fmtDur(now() - r.started)} in</span></div>
        <div class="p-body"><ul class="activity">${(r.activity || []).map(([ts, text, live]) => `<li><span class="ts">${ts}</span><span class="${live ? 'live' : ''}">${text}</span></li>`).join('')}</ul></div>
        <div class="p-foot"><span>No gate open. Next stop: ${esc(r.working.next)}.</span><button class="btn" data-interrupt>Send a message anyway</button></div>
      </section>`;
    } else {
      const pr = r.stages.find((s) => s.id === 'pr').note;
      panel = `<section class="panel" aria-label="Result">
        <div class="p-head">${icon('done', 'ok')}<strong>${r.done.label}</strong><span class="since">${fmtDur(now() - r.done.when)} ago</span></div>
        <div class="p-body"><p>${r.done.text || `<a href="https://${pr}" target="_blank" rel="noopener">${pr.replace('github.com/acme/', '')}</a> merged with no review comments, so the feedback stage was skipped.`}</p><p class="muted">${r.done.note || 'The worktree is kept until you clear the run.'}</p></div>
        <div class="p-foot"><span>${r.done.foot || 'Every stage closed.'}</span><button class="btn" data-clear>Clear from board</button></div>
      </section>`;
    }
    el.innerHTML = `<div class="d-wrap">
      <button class="btn d-back" data-back>${icon('back')}Runs</button>
      <div class="d-head">
        <div class="grow"><span class="key">${r.key}</span><h1>${esc(r.title)}</h1>
          <div class="meta"><span class="badge kind">${r.kind}</span><span>${icon('branch')}<code>${esc(r.branch)}</code></span><span>${icon('clock')}started ${fmtDur(now() - r.started)} ago</span></div>
        </div>
        <div class="actions"><button class="btn" data-open>${icon('open')}Open in Claude Code <kbd>⌘O</kbd></button></div>
      </div>
      <div class="rail" aria-label="Stages">${rail}</div>
      ${panel}
      <h2 class="hist-h">Stage notes</h2>
      <ul class="hist">${r.history.map(([a, b]) => `<li>${icon('done', 'skip')}<span><b>${esc(a)}</b> · ${esc(b)}</span></li>`).join('')}</ul>
    </div>`;
    const ta = el.querySelector('#answer');
    if (ta) autosize(ta);
  }

  function autosize(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.min(160, ta.scrollHeight) + 'px';
  }

  function render() { renderList(); renderDetail(); }

  function select(id, opts) {
    selectedId = id;
    $('app').dataset.view = id ? 'detail' : 'list';
    render();
    if (opts && opts.focusComposer) {
      const ta = $('answer');
      if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    } else if (opts && opts.focusList) {
      const row = $('list').querySelector('.row[aria-selected="true"]');
      if (row) row.focus();
    }
  }

  /* Transitions after an answer: the simulation that stands in for the real session. */
  function setStage(r, id, status, note) {
    const target = r.stages.findIndex((s) => s.id === id);
    r.stages = r.stages.map((s, i) => {
      if (i === target) return { ...s, status, note: note !== undefined ? note : s.note };
      if (i < target && (s.status === 'pending' || s.status === 'active')) return { ...s, status: 'done' };
      return s;
    });
  }
  function toWorking(r, label, next, activity) {
    r.gate = null; r.done = null;
    r.working = { label, next };
    r.activity = activity;
  }
  function openGate(r, id, kind, summary) {
    r.working = null; r.done = null;
    r.gate = { id, since: now(), summary, kind };
    notify(r);
    render();
  }
  const timers = [];
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));
  const ts = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

  function answer(r, text) {
    const gate = r.gate.id;
    r.history.push([gate, text]);
    delete composerDraft[r.id];
    const gkind = r.gate.kind;
    if (gate === 'G1') {
      toWorking(r, 'grilling · drafting the plan from your answers', 'G2 plan', [[ts(), 'G1 · ' + esc(text)], [ts(), 'grilling · writing the plan summary', true]]);
      later(6000, () => { openGate(r, 'G2', gkind === 'scope2' ? 'plan2' : 'plan', 'What ships, what is deferred · Implement?'); });
    } else if (gate === 'G2') {
      setStage(r, 'plan', 'done', (gkind === 'plan2' ? 'One PR, 3 pts' : 'One PR, 5 pts') + ' · G2: ' + text);
      setStage(r, 'implement', 'active');
      toWorking(r, 'tdd · writing the first red spec', 'G3 if the diff touches UI, otherwise review', [[ts(), 'G2 · ' + esc(text)], [ts(), 'tdd · <code>milestone_closer_spec.rb</code> · red', true]]);
    } else if (gate === 'G3') {
      setStage(r, 'implement', 'done', (r.stages.find((s) => s.id === 'implement').note || '') + ' · G3: go');
      setStage(r, 'review', 'active');
      toWorking(r, 'ready-for-review · spec-review and code-review running', 'G4 review triage', [[ts(), 'G3 · ' + esc(text)], [ts(), 'ready-for-review · 2 agents running', true]]);
      later(9000, () => { openGate(r, 'G4', 'triage2', '2 findings · 2 fix'); });
    } else if (gate === 'G4') {
      toWorking(r, 'applying the fixes you chose', 'File PR, no stop', [[ts(), 'G4 · ' + esc(text)], [ts(), 'tdd · fixing finding 1', true]]);
      later(7000, () => {
        setStage(r, 'review', 'done', 'G4: ' + text);
        setStage(r, 'pr', 'done', 'github.com/acme/harbor/pull/284');
        r.working = { label: 'PR open · waiting for reviewers', next: 'G5 when a reviewer comments' };
        r.activity = [[ts(), 'gh pr create · <a href="https://github.com/acme/harbor/pull/284" target="_blank" rel="noopener">harbor#284</a>'], ...r.activity];
        r.history.push(['File PR', 'harbor#284']);
        render();
      });
    } else if (gate === 'G5') {
      setStage(r, 'feedback', 'done', '1 reply · re-read: no new comments');
      r.gate = null; r.working = null;
      r.done = { label: 'Replied', when: now(), text: 'Reply posted on <a href="https://github.com/acme/harbor/pull/271" target="_blank" rel="noopener">harbor#271</a>. The PR was re-read afterwards: no new comments.', foot: 'Every stage closed. Clear the run once the PR merges.' };
      r.history.push(['Feedback', 'replied to the reviewer, PR re-read']);
    }
    render();
    toast(`Sent to ${r.key}`);
  }

  /* Notifications and toasts */
  function notify(r) {
    const n = document.createElement('div');
    n.className = 'notice'; n.setAttribute('role', 'status');
    n.innerHTML = `<div class="appicon">${icon('bell')}</div><div>
      <div class="nh"><span>Clearance</span><span>now</span></div>
      <div class="nt">${r.key} needs you</div>
      <div class="nb">${r.gate.id} ${GATE_NAME[r.gate.id]} · ${esc(r.gate.summary)}</div>
      <div class="na"><button class="btn primary" data-reply>Reply</button><button class="btn" data-later>Later</button></div></div>`;
    n.querySelector('[data-reply]').addEventListener('click', () => { n.remove(); select(r.id, { focusComposer: true }); });
    n.querySelector('[data-later]').addEventListener('click', () => n.remove());
    $('notices').appendChild(n);
    later(12000, () => n.remove());
  }
  function toast(text) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = text;
    $('app').appendChild(t);
    later(2200, () => t.remove());
  }

  /* Events */
  $('list').addEventListener('click', (e) => {
    const row = e.target.closest('.row');
    if (row) select(row.dataset.id, { focusList: true });
  });
  $('list').addEventListener('keydown', (e) => {
    const flat = ordered().flat;
    const i = flat.findIndex((r) => r.id === selectedId);
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); select(flat[Math.min(flat.length - 1, i + 1)].id, { focusList: true }); }
    else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); select(flat[Math.max(0, i - 1)].id, { focusList: true }); }
    else if (e.key === 'n' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); openSheet(); }
    else if (e.key === 'Enter') { e.preventDefault(); const ta = $('answer'); if (ta) ta.focus(); else $('detail').querySelector('.btn:not(.d-back)').focus(); }
  });
  $('detail').addEventListener('click', (e) => {
    const r = byId(selectedId);
    const quick = e.target.closest('[data-quick]');
    if (quick) {
      composerDraft[r.id] = quick.dataset.quick;
      renderDetail();
      const ta = $('answer'); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
      return;
    }
    if (e.target.closest('[data-open]')) { toast(`Opening ${r.key} in Claude Code`); return; }
    if (e.target.closest('[data-back]')) { selectedId = null; $('app').dataset.view = 'list'; render(); return; }
    if (e.target.closest('[data-interrupt]')) { toast('Interrupting between gates blocks a session you may not be watching. Open it in Claude Code instead.'); return; }
    if (e.target.closest('[data-clear]')) {
      runs.splice(runs.indexOf(r), 1);
      const next = ordered().flat[0];
      select(next ? next.id : null, { focusList: true });
      toast(`${r.key} cleared`);
      return;
    }
  });
  $('detail').addEventListener('submit', (e) => {
    if (e.target.id !== 'answer-form') return;
    e.preventDefault();
    const r = byId(selectedId);
    const text = $('answer').value.trim();
    if (!text) { $('answer').focus(); return; }
    answer(r, text);
    const row = $('list').querySelector('.row[aria-selected="true"]');
    if (row) row.focus();
  });
  $('detail').addEventListener('input', (e) => {
    if (e.target.id === 'answer') {
      composerDraft[selectedId] = e.target.value;
      autosize(e.target);
      e.target.closest('.composer').querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c.dataset.quick === e.target.value));
    }
  });
  $('detail').addEventListener('keydown', (e) => {
    if (e.target.id === 'answer' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('send').click(); }
    if (e.target.id === 'answer' && e.key === 'Escape') { e.target.blur(); const row = $('list').querySelector('.row[aria-selected="true"]'); if (row) row.focus(); }
  });

  document.addEventListener('keyup', (e) => { if (e.key === 'Meta') $('app').classList.remove('cmd-held'); });
  window.addEventListener('blur', () => $('app').classList.remove('cmd-held'));
  document.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (e.key === 'Meta') $('app').classList.add('cmd-held');
    if (mod && e.key === 'k') { e.preventDefault(); openPalette(); return; }
    if (mod && e.key === 'n') { e.preventDefault(); openSheet(); return; }
    if (!$('sheet').hidden) return;
    if (mod && e.key === 'o') { e.preventDefault(); if (selectedId) toast(`Opening ${byId(selectedId).key} in Claude Code`); return; }
    if (mod && /^[1-9]$/.test(e.key)) {
      const flat = ordered().flat; const r = flat[Number(e.key) - 1];
      if (r) { e.preventDefault(); select(r.id, { focusComposer: !!r.gate, focusList: !r.gate }); }
      return;
    }
    if (e.key === 'Escape' && !$('palette').hidden) closePalette();
  });

  /* New run sheet */
  const ISSUES = [
    { key: 'HBR-520', title: 'Weekly client digest email', kind: 'feature', state: 'Todo', pts: 3 },
    { key: 'HBR-521', title: 'Milestone close emails the PM twice', kind: 'bug', state: 'Todo', pts: 1 },
    { key: 'HBR-515', title: 'Utilization export grouped by team', kind: 'feature', state: 'Backlog', pts: 2 },
    { key: 'HBR-466', title: 'Deliverable search facets', kind: 'feature', state: 'In Progress', pts: 3, pr: 'github.com/acme/harbor/pull/260' },
    { key: 'HBR-480', title: 'Client create/update tools', kind: 'feature', state: 'In Progress', pts: 3 },
    { key: 'HBM-204', title: 'Budget scan ignores archived milestones', kind: 'bug', state: 'Todo', pts: 2 },
    { key: 'CP-91', title: 'Pipeline plugin: G3 fallback without a dev server', kind: 'feature', state: 'Todo', pts: 1 },
  ];
  const REPO_BY_PREFIX = { HBR: 'acme/harbor', HBM: 'acme/harbor-mobile', CP: 'mark-kraemer/clearance' };
  let nrKind = 'feature', nrIssue = null, nrPick = -1, nrKindTouched = false, nrRepoTouched = false;
  const slug = (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48).replace(/-+$/g, '');
  const parseTask = (raw) => { const m = raw.trim().match(/^([A-Za-z]{2,}-\d+)\s*(.*)$/); return m ? { key: m[1].toUpperCase(), title: m[2] || '' } : { key: null, title: raw.trim() }; };
  const onBoard = (key) => runs.find((r) => r.key === key);
  const issueMatches = (q) => { q = q.trim().toLowerCase(); return ISSUES.filter((i) => !q || (i.key + ' ' + i.title).toLowerCase().includes(q)); };

  function setKind(k) {
    nrKind = k;
    $('sheet').querySelectorAll('[data-kind]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.kind === k)));
    updateDerived();
  }
  function updateDerived() {
    const raw = $('nr-task').value.trim();
    const branch = slug(raw);
    const repo = $('nr-repo').value.split('/').pop();
    $('nr-branch').textContent = branch;
    $('nr-cmd').innerHTML = raw
      ? `~/work/${esc(repo)}/${esc(branch)} $ <b>claude</b> -p "/pipeline ${nrKind} ${esc(raw)}" --output-format stream-json`
      : `~/work/${esc(repo)}/… $ <b>claude</b> -p "/pipeline ${nrKind} …" --output-format stream-json`;
    const { key } = parseTask(raw);
    const dup = key && onBoard(key);
    const err = $('nr-err');
    if (dup) {
      const st = activeStage(dup);
      err.textContent = `${dup.key} is already on the board (${st.label}${dup.gate ? ' · ' + dup.gate.id + ' ' + GATE_NAME[dup.gate.id] : ''}).`;
      err.hidden = false;
      $('nr-start').innerHTML = 'Go to run <kbd>⌘↩</kbd>';
    } else {
      if (!err.dataset.keep) err.hidden = true;
      $('nr-start').innerHTML = 'Start run <kbd>⌘↩</kbd>';
    }
    const sub = $('nr-issue');
    if (nrIssue) {
      const short = nrIssue.pr ? nrIssue.pr.replace('github.com/acme/', '').replace('/pull/', '#') : '';
      sub.textContent = `Linear · ${nrIssue.state} · ${nrIssue.pts} pt${nrIssue.pts === 1 ? '' : 's'}` + (short ? ` · open PR ${short}` : '');
    } else sub.textContent = raw && !key ? 'No Linear issue. The run is named by this title.' : '';
  }
  function renderPicker() {
    const list = $('nr-list');
    const items = issueMatches($('nr-task').value);
    nrPick = Math.max(-1, Math.min(nrPick, items.length - 1));
    list.innerHTML = items.length
      ? items.map((i, n) => {
          const dup = onBoard(i.key);
          const meta = dup ? '<span class="meta warn">On the board</span>' : i.pr ? '<span class="meta warn">PR open</span>' : `<span class="meta">${i.state} · ${i.pts} pt${i.pts === 1 ? '' : 's'}</span>`;
          return `<li role="option" data-n="${n}" aria-selected="${n === nrPick}"><span class="key">${i.key}</span><span class="ttl">${esc(i.title)}</span>${meta}</li>`;
        }).join('')
      : '<li class="none">No matching issue. Start with this title.</li>';
    list.hidden = false;
    $('nr-task').setAttribute('aria-expanded', 'true');
  }
  function closePicker() { $('nr-list').hidden = true; $('nr-task').setAttribute('aria-expanded', 'false'); nrPick = -1; }
  function chooseIssue(i) {
    nrIssue = i;
    $('nr-task').value = `${i.key} ${i.title}`;
    if (!nrKindTouched) setKind(i.kind);
    if (!nrRepoTouched) { const repo = REPO_BY_PREFIX[i.key.split('-')[0]]; if (repo) $('nr-repo').value = repo; }
    closePicker();
    updateDerived();
  }
  function openSheet() {
    closePalette();
    nrIssue = null; nrKindTouched = false; nrRepoTouched = false;
    $('nr-task').value = ''; $('nr-task').removeAttribute('aria-invalid'); $('nr-err').hidden = true; delete $('nr-err').dataset.keep;
    $('nr-repo').value = 'acme/harbor'; $('nr-open').checked = false;
    setKind('feature');
    closePicker();
    $('sheet').hidden = false;
    $('nr-task').focus();
  }
  function closeSheet() { $('sheet').hidden = true; }
  function startRun() {
    const raw = $('nr-task').value.trim();
    if (!raw) { $('nr-err').textContent = 'Name the task. Pick a Linear issue, or type a short title.'; $('nr-err').hidden = false; $('nr-err').dataset.keep = '1'; $('nr-task').setAttribute('aria-invalid', 'true'); $('nr-task').focus(); return; }
    const { key, title } = parseTask(raw);
    const dup = key && onBoard(key);
    if (dup) { closeSheet(); select(dup.id, { focusComposer: !!dup.gate, focusList: !dup.gate }); toast(`${dup.key} is already on the board`); return; }
    const name = key || title;
    const branch = slug(raw) || 'new-run';
    const repo = $('nr-repo').value;
    const issue = nrIssue;
    const kind = nrKind;
    const r = {
      id: 'run-' + Date.now(), key: key || 'NEW', title: title || raw, kind, branch, started: now(),
      stages: stages(kind, kind === 'feature' ? { plan: 'active' } : { implement: 'active' }),
      gate: null,
      working: { label: 'checking the work does not already exist', next: kind === 'feature' ? 'G1 scope' : 'G3 if the fix touches UI, otherwise review' },
      activity: [[ts(), `Step 0 · ${issue ? 'reading ' + issue.key + ' in Linear, then' : ''} searching open PRs and branches in ${esc(repo)}`.replace('  ', ' '), true]],
      history: [['Started', `${kind} pipeline, worktree ${branch}${issue ? ' · Linear ' + issue.state : ''}`]],
    };
    runs.unshift(r);
    const openToo = $('nr-open').checked;
    closeSheet();
    select(r.id, { focusList: true });
    toast(openToo ? `Started ${name} · opening in Claude Code` : `Started ${name}`);
    later(5000, () => {
      if (!runs.includes(r)) return;
      r.activity = r.activity.map(([a, b]) => [a, b]);
      if (issue && issue.pr) {
        const short = issue.pr.replace('github.com/acme/', '').replace('/pull/', '#');
        r.stages = r.stages.map((st) => ({ ...st, status: 'skipped', note: st.id === 'pr' ? issue.pr : '' }));
        r.working = null;
        r.done = { label: 'Already open', when: now(), text: `<a href="https://${issue.pr}" target="_blank" rel="noopener">${short}</a> is already open for ${issue.key}. The pipeline reported it and stopped; nothing was started.`, note: 'No worktree was created.', foot: 'Nothing to do here.' };
        r.activity.unshift([ts(), `Step 0 · found ${short} open for ${issue.key} · stopped`]);
        r.history.push(['Step 0', `${short} already open · stopped`]);
        render();
        toast(`${issue.key} already has an open PR`);
        return;
      }
      r.activity.unshift([ts(), 'Step 0 · nothing open for this work']);
      if (kind === 'feature') {
        openGate(r, 'G1', 'scope2', `One PR, ${issue ? issue.pts : 3} pts · two questions`);
      } else {
        r.working = { label: 'tdd · writing the regression spec', next: 'G3 if the fix touches UI, otherwise review' };
        r.activity.unshift([ts(), 'tdd · reproducing the bug in a spec', true]);
        render();
      }
    });
  }
  $('btn-new').addEventListener('click', openSheet);
  $('sheet').addEventListener('click', (e) => {
    if (e.target === $('sheet') || e.target.closest('[data-cancel]')) { closeSheet(); return; }
    const k = e.target.closest('[data-kind]');
    if (k) { nrKindTouched = true; setKind(k.dataset.kind); }
    const li = e.target.closest('#nr-list li[data-n]');
    if (li) chooseIssue(issueMatches($('nr-task').value)[Number(li.dataset.n)]);
  });
  $('nr-list').addEventListener('mousedown', (e) => e.preventDefault());
  $('nr-task').addEventListener('focus', () => { nrPick = -1; renderPicker(); });
  $('nr-task').addEventListener('blur', () => closePicker());
  $('nr-task').addEventListener('input', () => {
    const v = $('nr-task').value;
    nrIssue = ISSUES.find((i) => `${i.key} ${i.title}` === v.trim()) || null;
    $('nr-task').removeAttribute('aria-invalid'); delete $('nr-err').dataset.keep;
    nrPick = -1; renderPicker(); updateDerived();
  });
  $('nr-task').addEventListener('keydown', (e) => {
    const open = !$('nr-list').hidden;
    const items = issueMatches($('nr-task').value);
    if (e.key === 'ArrowDown') { e.preventDefault(); nrPick = Math.min(items.length - 1, nrPick + 1); renderPicker(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); nrPick = Math.max(-1, nrPick - 1); renderPicker(); }
    else if (e.key === 'Enter' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); if (open && nrPick >= 0) chooseIssue(items[nrPick]); else if (open && items.length === 1 && $('nr-task').value.trim()) chooseIssue(items[0]); else closePicker(); }
    else if (e.key === 'Escape' && open) { e.preventDefault(); e.stopPropagation(); closePicker(); }
  });
  $('nr-repo').addEventListener('change', () => { nrRepoTouched = true; updateDerived(); });
  $('newrun-form').addEventListener('submit', (e) => { e.preventDefault(); startRun(); });
  $('sheet').addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); }
    else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); startRun(); }
  });

  /* Command palette */
  let palIndex = 0;
  function palItems(q) {
    q = q.trim().toLowerCase();
    const flat = ordered().flat;
    const items = flat.filter((r) => !q || (r.key + ' ' + r.title + ' ' + (r.gate ? r.gate.id + ' ' + GATE_NAME[r.gate.id] : '')).toLowerCase().includes(q))
      .map((r, i) => ({ kind: 'run', id: r.id, label: r.title, key: r.key, trail: r.gate ? `${r.gate.id} · waiting ${fmtDur(now() - r.gate.since)}` : group(r) === 'done' ? r.done.label : 'working', glyph: r.gate ? icon('attn', 'attn') : group(r) === 'done' ? icon('done', 'ok') : icon('work', 'work') }));
    const cmds = [
      { kind: 'cmd', id: 'new', label: 'New run', trail: '⌘N', glyph: icon('plus') },
      { kind: 'cmd', id: 'next', label: 'Jump to the run waiting longest', trail: '', glyph: icon('attn', 'attn') },
      { kind: 'cmd', id: 'theme', label: 'Toggle appearance', trail: '', glyph: icon('moon') },
      { kind: 'cmd', id: 'open', label: 'Open selected run in Claude Code', trail: '⌘O', glyph: icon('open') },
      { kind: 'cmd', id: 'clear', label: 'Clear the board', trail: '', glyph: icon('skipped') },
      { kind: 'cmd', id: 'reset', label: 'Reset sample runs', trail: '', glyph: icon('pending') },
    ].filter((c) => !q || c.label.toLowerCase().includes(q));
    return { items, cmds };
  }
  function renderPalette() {
    const { items, cmds } = palItems($('pal-input').value);
    const all = [...items, ...cmds];
    palIndex = Math.max(0, Math.min(palIndex, all.length - 1));
    let html = '';
    if (items.length) html += `<li class="ph">Runs</li>` + items.map((it, i) => `<li><button class="${i === palIndex ? 'hl' : ''}" data-i="${i}">${it.glyph}<span><span class="key">${it.key}</span> ${esc(it.label)}</span><span class="trail">${it.trail}</span></button></li>`).join('');
    if (cmds.length) html += `<li class="ph">Commands</li>` + cmds.map((it, j) => { const i = items.length + j; return `<li><button class="${i === palIndex ? 'hl' : ''}" data-i="${i}">${it.glyph}<span>${esc(it.label)}</span><span class="trail">${it.trail}</span></button></li>`; }).join('');
    if (!all.length) html = `<li class="group-empty">Nothing matches.</li>`;
    $('pal-list').innerHTML = html;
  }
  function runPal(i) {
    const { items, cmds } = palItems($('pal-input').value);
    const it = [...items, ...cmds][i];
    if (!it) return;
    closePalette();
    if (it.kind === 'run') select(it.id, { focusComposer: !!byId(it.id).gate, focusList: !byId(it.id).gate });
    else if (it.id === 'next') { const r = ordered().needs[0]; if (r) select(r.id, { focusComposer: true }); else toast('Nothing is waiting on you'); }
    else if (it.id === 'new') openSheet();
    else if (it.id === 'theme') toggleTheme();
    else if (it.id === 'open') toast(selectedId ? `Opening ${byId(selectedId).key} in Claude Code` : 'Select a run first');
    else if (it.id === 'clear') { runs.splice(0, runs.length); selectedId = null; render(); toast('Board cleared'); }
    else if (it.id === 'reset') { runs.splice(0, runs.length, ...clone(SEED_RUNS)); const f = ordered().needs[0]; selectedId = f ? f.id : null; render(); toast('Sample runs restored'); }
  }
  function openPalette() { palIndex = 0; $('palette').hidden = false; $('pal-input').value = ''; renderPalette(); $('pal-input').focus(); }
  function closePalette() { $('palette').hidden = true; }
  $('btn-palette').addEventListener('click', openPalette);
  $('palette').addEventListener('click', (e) => { if (e.target === $('palette')) closePalette(); const b = e.target.closest('[data-i]'); if (b) runPal(Number(b.dataset.i)); });
  $('pal-input').addEventListener('input', () => { palIndex = 0; renderPalette(); });
  $('pal-input').addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); palIndex += 1; renderPalette(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); palIndex -= 1; renderPalette(); }
    else if (e.key === 'Enter') { e.preventDefault(); runPal(palIndex); }
    else if (e.key === 'Escape') { closePalette(); }
  });

  /* Theme */
  function themeIcon() {
    const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    $('btn-theme').innerHTML = `<svg class="ico" aria-hidden="true"><use href="#i-${dark ? 'sun' : 'moon'}"/></svg>`;
  }
  function toggleTheme() {
    const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('clearance-theme', document.documentElement.dataset.theme); } catch (err) {}
    themeIcon();
  }
  $('btn-theme').addEventListener('click', toggleTheme);
  try { const t = localStorage.getItem('clearance-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (err) {}
  themeIcon();

  /* Boot: the longest-waiting run is selected, and one working run reaches a gate after a while. */
  const first = ordered().needs[0];
  selectedId = first ? first.id : null;
  if (matchMedia('(max-width: 760px)').matches) $('app').dataset.view = 'list'; else $('app').dataset.view = 'detail';
  render();
  setInterval(render, 30000);
  later(28000, () => {
    const r = byId('hbr-497');
    if (!r || r.gate || !r.working) return;
    setStage(r, 'implement', 'active', '18 specs green · 3 commits');
    r.activity = [[ts(), 'tdd · 18 of 18 green'], [ts(), 'Commit · Add the CSV download to the utilization report'], ...r.activity];
    openGate(r, 'G3', 'visual2', 'Screenshot on dev data · 2 compromises');
  });
})();
</script>
